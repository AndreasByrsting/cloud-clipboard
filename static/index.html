<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="云剪贴板" />
  <title>云剪贴板</title>
  <script>
    window.__APP_BUILD__ = '{{BUILD}}';
    window.__API_VERSION__ = '{{API_VERSION}}';
    window.addEventListener('load', function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) { registration.unregister(); });
          }).catch(function () {});
        }
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              if (key.indexOf('cloud-clipboard') === 0) caches.delete(key);
            });
          }).catch(function () {});
        }
      } catch (_) {}
    });
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon/friends_link_send_share_icon_123622.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon/friends_link_send_share_icon_123622.svg" />
  <link rel="stylesheet" href="/css/tokens.css?v={{BUILD}}" />
  <link rel="stylesheet" href="/css/base.css?v={{BUILD}}" />
  <link rel="stylesheet" href="/css/layout.css?v={{BUILD}}" />
  <link rel="stylesheet" href="/css/components.css?v={{BUILD}}" />
  <link rel="stylesheet" href="/css/animations.css?v={{BUILD}}" />
  <link rel="stylesheet" href="/css/theme.css?v={{BUILD}}" />
</head>

</body>

</html>
